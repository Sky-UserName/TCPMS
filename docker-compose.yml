services:
  mysql:
    image: mysql:8.0
    container_name: tcpms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tcpms
      MYSQL_USER: tcpms
      MYSQL_PASSWORD: tcpms_dev
      MYSQL_ROOT_PASSWORD: root_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - tcpms_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  tcpms_mysql_data:

